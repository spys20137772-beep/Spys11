<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>등불지기 - Lanternbound</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="c"></canvas>

  <div id="hud" class="hidden">
    <div class="xpbar"><div id="xpfill"></div><span id="lv">Lv 1</span></div>
    <div class="hud-row">
      <div id="slots" class="slots"></div>
      <div id="timer" class="timer">00:00</div>
      <div class="stats"><span id="kills">💀 0</span><span id="gold">🪙 0</span></div>
    </div>
    <div id="bossbar" class="bossbar hidden"><span>공허의 왕</span><div class="track"><div id="bossfill"></div></div></div>
    <div id="banner" class="banner"></div>
  </div>

  <div id="screens" class="hidden"></div>
  <div id="fps"></div>

  <script src="build/game.js"></script>
</body>
</html>
