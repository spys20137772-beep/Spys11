<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>카드팩 대장</title>
<style>
:root{--panel:#2a2150;--panel2:#3b2f70;--gold:#ffd23c;--txt:#fff7e6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:#120d26;color:var(--txt);font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif}
body{overflow-x:hidden;overflow-y:auto}
button{font-family:inherit;color:inherit;cursor:pointer}
#app{position:relative;max-width:1100px;min-height:100%;margin:0 auto;padding:8px 8px 84px;display:flex;flex-direction:column;gap:8px}
.pane{display:none}
#pcart.on{display:grid;gap:8px;grid-template-columns:1fr 330px;grid-template-rows:minmax(330px,1fr) auto;grid-template-areas:"stage staff" "buy staff"}
#pinv.on,#pdex.on{display:flex;flex-direction:column;gap:10px;background:var(--panel);border-radius:14px;padding:12px}
@media (min-width:821px){html,body{overflow:hidden}#app{height:100%}.pane.on{flex:1;min-height:0}#pcart.on{grid-template-rows:minmax(0,1fr) auto}#staffbox{overflow:auto}#pinv.on,#pdex.on{overflow:auto}}
@media (max-width:820px){#pcart.on{grid-template-columns:1fr;grid-template-rows:auto;grid-template-areas:"stage" "buy" "staff"}}
#tabbar{position:fixed;left:0;right:0;bottom:0;z-index:12;display:flex;justify-content:center;gap:6px;padding:6px 8px calc(6px + env(safe-area-inset-bottom));background:#1a1338f0;border-top:2px solid var(--panel2)}
#tabbar button{flex:1;max-width:260px;border:0;border-radius:12px;background:transparent;padding:5px;font-size:22px;display:flex;flex-direction:column;align-items:center;gap:1px;position:relative;opacity:.65}
#tabbar button span{font-size:14px;font-weight:800}
#tabbar button.on{background:var(--panel2);opacity:1;color:var(--gold)}
#tabbar b{position:absolute;top:2px;left:calc(50% + 12px);background:#ff3b5c;color:#fff;font-size:12px;border-radius:9px;padding:0 6px;line-height:18px}
#tabbar b:empty{display:none}
.phead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.phead h2{margin:0;font-size:22px;color:var(--gold);flex:1}
.phead h2 small{font-size:15px;color:var(--txt);opacity:.8;font-weight:700}
@media (max-width:520px){.phead h2 small{display:block;margin-top:2px}.phead .btn{width:100%}}
#selldups{background:#2fa06b}
#selldups.off{background:#4a416f;opacity:.6}
.note{margin:0;font-size:14px;opacity:.75}
#invfilter{display:flex;gap:6px;flex-wrap:wrap}
#invfilter button{border:2px solid var(--c,#6d62a8);background:#1b1440;border-radius:20px;padding:3px 12px;font-size:14px;font-weight:800;color:var(--c,#fff)}
#invfilter button.on{background:var(--c,#6d62a8);color:#1b1440}
#invgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.ic{position:relative;border:3px solid var(--c);border-radius:12px;background:linear-gradient(165deg,#fffdf4,var(--c2));color:#2a1d52;padding:20px 6px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.ic.sssc{background:linear-gradient(135deg,#ffe17a,#ff9ad5,#7ad6ff,#ffe17a);background-size:300% 300%;animation:rainbg 2s linear infinite}
.ic .gr{position:absolute;left:6px;top:3px;font-weight:900;font-size:14px;color:var(--c);text-shadow:0 0 2px #000,0 0 2px #000}
.ic .n{position:absolute;right:5px;top:3px;font-weight:900;font-size:13px;background:#2a1d52;color:#fff;border-radius:8px;padding:0 6px}
.ic .art{font-size:40px;line-height:1;height:48px;display:flex;align-items:center;justify-content:center}
.ic .art img{height:48px}
.ic .nm{font-size:15px;font-weight:800}
.ic button{width:100%;border:0;border-radius:8px;padding:5px 4px;font-size:13px;font-weight:800;background:#2a1d52;color:#fff}
.ic button.s1{background:#ffb02e;color:#3a2300}
.ic button[hidden]{display:none}
#invempty{opacity:.6;text-align:center;padding:30px;font-size:17px}
#dexgrid{display:flex;flex-direction:column;gap:8px;align-items:center}
.shake{animation:shake .45s}
@keyframes shake{0%,100%{transform:translate(0)}15%{transform:translate(calc(var(--sh,6px)*-1),var(--sh,6px))}35%{transform:translate(var(--sh,6px),calc(var(--sh,6px)*-1))}55%{transform:translate(calc(var(--sh,6px)*-.7),calc(var(--sh,6px)*-.5))}75%{transform:translate(calc(var(--sh,6px)*.5),calc(var(--sh,6px)*.5))}}
#top{grid-area:top;display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--panel);border-radius:14px;padding:8px 12px}
#top .title{font-weight:900;font-size:20px;color:var(--gold)}
#coins{font-size:22px;font-weight:900;min-width:110px}
#coins.bump{animation:bump .25s}
@keyframes bump{50%{transform:scale(1.25);color:#fff}}
#dexbar{flex:1;min-width:150px;display:flex;align-items:center;gap:8px;font-size:16px;font-weight:700}
#dexbar .bar{flex:1;height:14px;background:#150f30;border-radius:8px;overflow:hidden}
#dexbar .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff6bb5,#ffd23c);transition:width .4s}
#time{font-size:16px;font-weight:700;opacity:.85}
.btn{border:0;border-radius:12px;background:var(--panel2);padding:8px 14px;font-size:16px;font-weight:800}
.btn:active{transform:scale(.96)}
#stage{grid-area:stage;position:relative;min-height:330px;border-radius:16px;overflow:hidden;background:#241a4a center/cover no-repeat;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:10px}
#stage::before{content:"";position:absolute;inset:0;background:rgba(14,8,40,.45)}
#stage>*{position:relative}
#idlepack{width:min(220px,50%);cursor:pointer;animation:bob 1.6s ease-in-out infinite;filter:drop-shadow(0 8px 14px #000a)}
#idlepack.t1{filter:grayscale(1) brightness(1.35) drop-shadow(0 8px 14px #000a)}
#idlepack.t2{filter:sepia(1) saturate(5) hue-rotate(-8deg) brightness(1.15) drop-shadow(0 8px 14px #000a)}
@keyframes bob{50%{transform:translateY(-10px) rotate(2deg)}}
#cards{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;--cw:clamp(52px,calc((100vw - 90px)/5),118px)}
.card{width:var(--cw);aspect-ratio:2/3;perspective:700px;cursor:pointer;animation:deal .35s both}
@keyframes deal{from{opacity:0;transform:translateY(-70px) scale(.5) rotate(-12deg)}}
.card .in{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .42s cubic-bezier(.2,.9,.3,1.25)}
.card.flipped .in{transform:rotateY(180deg)}
.card .bk,.card .fc{position:absolute;inset:0;border-radius:10px;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:3px solid var(--c,#9aa5b1);overflow:hidden}
.card .bk{background:radial-gradient(circle at 50% 45%,#5b46c9,#241a6a 70%);display:flex;align-items:center;justify-content:center}
.card .bk img{width:62%;opacity:.95}
.card .bk.glow{animation:glow .55s ease-in-out infinite alternate;box-shadow:0 0 16px 5px var(--c)}
.card .bk.g7{animation:glow .4s ease-in-out infinite alternate,rain 1.2s linear infinite}
@keyframes glow{to{box-shadow:0 0 30px 12px var(--c);transform:scale(1.04)}}
@keyframes rain{to{filter:hue-rotate(360deg)}}
.card .fc{transform:rotateY(180deg);background:linear-gradient(165deg,#fffdf4,var(--c2,#ddd));display:flex;flex-direction:column;align-items:center;justify-content:center;color:#2a1d52}
.card .fc .gr{position:absolute;left:5px;top:3px;font-weight:900;font-size:clamp(11px,calc(var(--cw)*.18),15px);color:var(--c);text-shadow:0 0 2px #000,0 0 2px #000,0 0 3px #000}
.card .fc .em{font-size:calc(var(--cw)*.5);line-height:1}
.card .fc img{width:84%;margin-top:6px}
.card .fc .nm{font-size:14px;font-weight:800;margin-top:2px;white-space:nowrap}
.card .fc .tag{position:absolute;right:2px;top:2px;font-size:clamp(10px,calc(var(--cw)*.17),14px);font-weight:900;border-radius:8px;padding:0 5px;background:#ff3b5c;color:#fff}
.card .fc .tag.coin{background:#ffd23c;color:#4a3300}
.card.sssc .fc{background:linear-gradient(135deg,#ffe17a,#ff9ad5,#7ad6ff,#ffe17a);background-size:300% 300%;animation:rainbg 2s linear infinite}
@keyframes rainbg{to{background-position:300% 0}}
#hint{position:relative;font-size:17px;font-weight:800;text-align:center;background:#0009;padding:6px 14px;border-radius:12px;min-height:32px;max-width:96%}
#flipall{display:none}
#buy{grid-area:buy;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pk{border:3px solid var(--pc);border-radius:14px;background:linear-gradient(180deg,var(--panel2),var(--panel));padding:8px 6px;text-align:center;font-size:16px;font-weight:800;line-height:1.3;position:relative}
.pk .nm{font-size:18px;color:var(--pc)}
.pk .cost{font-size:19px}
.pk .odds{font-size:14px;opacity:.85;font-weight:600}
.pk .key{position:absolute;right:6px;top:4px;font-size:14px;opacity:.7}
.pk.off{opacity:.45;filter:grayscale(.6)}
.pk.free{animation:pulse .8s infinite alternate}
@keyframes pulse{to{box-shadow:0 0 18px 4px var(--pc)}}
#staffbox{grid-area:staff;background:var(--panel);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:8px}
#staffbox h3{margin:0;font-size:18px;color:var(--gold)}
#hire{width:100%;background:#2fa06b;font-size:17px}
#hire.off{background:#4a416f;opacity:.7}
#slots{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.slot{background:#1b1440;border-radius:10px;padding:5px;min-height:70px;position:relative}
.slot.empty{opacity:.35;display:flex;align-items:center;justify-content:center;font-size:14px}
.slot .hd{display:flex;align-items:center;gap:5px}
.slot .hd img,.slot .hd span.ic{width:26px;height:26px;object-fit:contain;font-size:20px;line-height:26px}
.slot .pb{flex:1;height:10px;border-radius:6px;background:#0c0824;overflow:hidden}
.slot .pb i{display:block;height:100%;background:#57e0a0;width:0}
.slot .mins{display:flex;gap:2px;margin-top:5px}
.mini{flex:1;aspect-ratio:1;border-radius:5px;border:2px solid var(--c);background:var(--c2);font-size:14px;display:flex;align-items:center;justify-content:center;min-width:0}
.mini.pop{animation:minipop .4s}
@keyframes minipop{from{transform:scale(1.7)}}
#toasts{position:fixed;right:10px;bottom:84px;display:flex;flex-direction:column;gap:6px;z-index:20;pointer-events:none}
.toast{background:#000c;border-left:6px solid var(--c);padding:6px 12px;border-radius:8px;font-size:15px;font-weight:800;animation:tin .3s,tout .5s 2.2s forwards}
@keyframes tin{from{transform:translateX(60px);opacity:0}}
@keyframes tout{to{opacity:0;transform:translateY(-10px)}}
.fl{position:fixed;font-weight:900;font-size:22px;color:var(--gold);text-shadow:0 2px 0 #000,0 0 6px #000;pointer-events:none;z-index:25;animation:flup 1s forwards}
@keyframes flup{to{transform:translateY(-60px);opacity:0}}
#fx{position:fixed;inset:0;pointer-events:none;z-index:15;width:100%;height:100%}
#flash{position:fixed;inset:0;pointer-events:none;z-index:16;background:#fff;opacity:0}
#banner{position:fixed;left:0;right:0;top:34%;text-align:center;font-size:clamp(40px,10vw,90px);font-weight:900;pointer-events:none;z-index:18;opacity:0;text-shadow:0 4px 0 #000,0 0 20px var(--c)}
#banner.on{animation:ban 1.5s}
@keyframes ban{0%{opacity:0;transform:scale(.3)}15%{opacity:1;transform:scale(1.15)}30%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:scale(1.1)}}
.ov{position:fixed;inset:0;z-index:30;background:#0b0620ee;display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;text-align:center;padding:14px;overflow:auto}
.ov.on{display:flex}
.ov h1{margin:0;font-size:clamp(34px,8vw,60px);color:var(--gold);text-shadow:0 4px 0 #000}
.ov p{margin:0;font-size:20px;font-weight:700;max-width:520px}
.big{background:linear-gradient(180deg,#ffd23c,#ff9a3c);color:#3a2300;border:0;border-radius:18px;font-size:28px;font-weight:900;padding:14px 56px;box-shadow:0 6px 0 #a35a00}
.big:active{transform:translateY(4px);box-shadow:0 2px 0 #a35a00}
.dexrow{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:center}
.dexrow .gl{width:52px;font-weight:900;font-size:18px;color:var(--c);text-align:right}
.dc{width:50px;height:58px;border-radius:8px;border:2px solid var(--c);background:var(--c2);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:26px;position:relative;color:#2a1d52}
.dc.no{background:#1a1238;color:#5f5493;font-size:22px;border-style:dashed}
.dc small{font-size:14px;font-weight:900;position:absolute;right:1px;bottom:-1px;background:#000a;color:#fff;border-radius:6px;padding:0 3px;line-height:1.1}
.dc img{width:90%}
.g0{--c:#9aa5b1;--c2:#e5eaef}.g1{--c:#5fbf6a;--c2:#d4f3d8}.g2{--c:#4aa3ff;--c2:#d3e9ff}.g3{--c:#a56bff;--c2:#e8d9ff}
.g4{--c:#ff6bb5;--c2:#ffd9ee}.g5{--c:#ff9a3c;--c2:#ffe2c2}.g6{--c:#ffd23c;--c2:#fff2b8}.g7{--c:#ff7ad6;--c2:#ffe9a8}
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <span class="title">🃏 카드팩 대장</span>
    <span id="coins">🪙 0</span>
    <div id="dexbar"><span id="dexn">📖 0/36</span><div class="bar"><i id="dexfill"></i></div></div>
    <span id="time">⏱ 0:00</span>
  </div>
  <div id="pcart" class="pane on">
  <div id="stage">
    <img id="idlepack" alt="팩">
    <div id="cards"></div>
    <div id="hint"></div>
    <button class="btn" id="flipall">모두 뒤집기 (스페이스)</button>
  </div>
  <div id="buy"></div>
  <div id="staffbox">
    <h3 id="staffh">👷 직원</h3>
    <button class="btn" id="hire">고용</button>
    <div id="slots"></div>
  </div>
  </div>
  <div id="pinv" class="pane">
    <div class="phead"><h2>🎒 내 카드 <small id="invsum"></small></h2><button class="btn" id="selldups">중복 모두 팔기</button></div>
    <p class="note">뽑은 카드는 전부 여기 쌓여요. 팔아도 도감 기록은 남아요.</p>
    <div id="invfilter"></div>
    <div id="invgrid"></div>
    <div id="invempty">아직 카드가 없어요. 🛒 카트에서 팩을 뜯어봐!</div>
  </div>
  <div id="pdex" class="pane">
    <div class="phead"><h2 id="dextitle">📖 도감</h2></div>
    <div id="dexgrid"></div>
  </div>
</div>
<nav id="tabbar">
  <button data-tab="cart" class="on">🛒<span>카트</span></button>
  <button data-tab="inv">🎒<span>내 카드</span><b id="invbadge"></b></button>
  <button data-tab="dex">📖<span>도감</span></button>
</nav>
<canvas id="fx"></canvas>
<div id="flash"></div>
<div id="banner"></div>
<div id="toasts"></div>

<div class="ov on" id="title">
  <h1>🃏 카드팩 대장</h1>
  <p>코인으로 팩을 까서 도감 36칸을 다 채워라!</p>
  <button class="big" id="startbtn">시작</button>
</div>
<div class="ov" id="result">
  <h1>🎉 도감 완성!</h1>
  <p id="resinfo"></p>
  <button class="big" id="againbtn">다시 하기</button>
</div>

<script>
// ================= 핵심 규칙(화면과 상관없는 부분) =================
//#CORE_START
// ---- CONFIG: 숫자는 여기서만 바꾸면 돼 ----
const CONFIG = {
  START_COINS: 40,        // 시작 코인
  PACK_SIZE: 5,           // 팩 하나에 들어있는 카드 수
  FREE_PACK_SEC: 10,      // 무료 동 팩이 다시 생기는 시간(초)
  // 팩 종류: 값(cost), 등급별 확률 가중치 [D,C,B,A,R,S,SSR,SSS]
  PACKS: [
    { id: 'bronze', name: '동 팩', cost: 20,  color: '#d98a4e', rates: [40, 25, 16, 10, 5, 3, 0.9, 0.1] },
    { id: 'silver', name: '은 팩', cost: 80,  color: '#c9d4e6', rates: [18, 24, 24, 16, 10, 6, 1.6, 0.4] },
    { id: 'gold',   name: '금 팩', cost: 400, color: '#ffd23c', rates: [0, 8, 22, 28, 20, 14, 6, 2] }
  ],
  SELL_PRICE: [1, 2, 3, 5, 12, 30, 90, 300], // 내 카드 1장을 팔면 받는 코인(등급별)
  STAFF_BASE_COST: 60,    // 첫 직원 값
  STAFF_COST_GROWTH: 1.45, // 직원을 고용할 때마다 값이 몇 배가 되는지
  STAFF_MAX: 8,           // 직원 최대 수
  STAFF_SEC: 8,           // 직원 한 명이 동 팩을 까는 간격(초)
  PITY: 0.05              // SSS가 안 나온 팩이 쌓일 때마다 SSS 확률이 (1 + 쌓인 팩 x 이 값)배로 커짐
};
const GRADES = ['D', 'C', 'B', 'A', 'R', 'S', 'SSR', 'SSS'];
// 카드 36장: [등급번호, 이모지, 이름]
const CARDS = [
  [0,'🐭','생쥐'],[0,'🐔','닭'],[0,'🐟','물고기'],[0,'🐸','개구리'],[0,'🐛','애벌레'],[0,'🐝','꿀벌'],[0,'🐌','달팽이'],[0,'🐜','개미'],
  [1,'🐶','강아지'],[1,'🐱','고양이'],[1,'🐰','토끼'],[1,'🐼','판다'],[1,'🐷','돼지'],[1,'🐮','소'],[1,'🐑','양'],
  [2,'🦊','여우'],[2,'🐻','곰'],[2,'🐧','펭귄'],[2,'🦆','오리'],[2,'🦉','부엉이'],[2,'🐢','거북이'],
  [3,'🦁','사자'],[3,'🐯','호랑이'],[3,'🐺','늑대'],[3,'🦈','상어'],[3,'🐙','문어'],
  [4,'🐘','코끼리'],[4,'🦒','기린'],[4,'🦜','앵무새'],[4,'🦩','홍학'],
  [5,'🐋','고래'],[5,'🦚','공작'],[5,'🦅','독수리'],
  [6,'🦄','유니콘'],[6,'🦖','티라노'],
  [7,'🐉','황금용']
];
let RNG = Math.random;           // 테스트에서 바꿔 끼울 수 있는 난수
let G = null;                    // 지금 판의 상태
const hooks = { emit() {} };     // 화면/소리가 연결되는 곳
function emit(t, d) { hooks.emit(t, d); }

// 새 판을 시작한다
function newGame() {
  G = { coins: CONFIG.START_COINS, owned: {}, seen: {}, count: 0, sold: 0, packs: 0, t: 0, free: 0, staff: [],
        reveal: null, won: false, winT: 0, lastTier: 0, dups: 0, dry: 0 };
}
// 직원 n+1번째를 고용하는 값
function staffCost() { return Math.round(CONFIG.STAFF_BASE_COST * Math.pow(CONFIG.STAFF_COST_GROWTH, G.staff.length)); }
// 가중치로 등급 하나를 뽑는다
function rollGrade(tier) {
  const r = CONFIG.PACKS[tier].rates.slice(); r[7] *= 1 + G.dry * CONFIG.PITY; let s = 0; for (const x of r) s += x;
  let v = RNG() * s; for (let i = 0; i < r.length; i++) { v -= r[i]; if (v < 0) return i; }
  return r.length - 1;
}
// 팩 하나를 뽑아 카드 번호 5개를 돌려준다(좋은 카드가 마지막에 오게 정렬)
function rollPack(tier) {
  const ids = [];
  for (let k = 0; k < CONFIG.PACK_SIZE; k++) {
    const g = rollGrade(tier), pool = [];
    CARDS.forEach((c, i) => { if (c[0] === g) pool.push(i); });
    ids.push(pool[Math.floor(RNG() * pool.length)]);
  }
  ids.sort((a, b) => CARDS[a][0] - CARDS[b][0]);
  if (CARDS[ids[ids.length - 1]][0] === 7) G.dry = 0; else G.dry++;
  return ids;
}
// 카드 한 장을 내 카드에 넣는다(처음 보는 카드면 도감에도 기록 = NEW)
function applyCard(id) {
  G.owned[id] = (G.owned[id] || 0) + 1;
  if (!G.seen[id]) {
    G.seen[id] = true; G.count++;
    if (G.count >= CARDS.length && !G.won) { G.won = true; G.winT = G.t; emit('won', {}); }
    return { isNew: true, n: G.owned[id] };
  }
  G.dups++;
  return { isNew: false, n: G.owned[id] };
}
// 내 카드 n장을 판다(도감 기록은 남음). 성공하면 받은 코인
function sellCard(id, n) {
  n = n || 1; if (!(G.owned[id] >= n) || n <= 0) return 0;
  const c = CONFIG.SELL_PRICE[CARDS[id][0]] * n;
  G.owned[id] -= n; G.coins += c; G.sold += n;
  emit('sell', { id, n, coins: c }); return c;
}
// 중복 카드(같은 카드 2장째부터)를 전부 판다
function sellDups() {
  let tot = 0, n = 0;
  for (const k in G.owned) { const x = G.owned[k] - 1; if (x > 0) { tot += CONFIG.SELL_PRICE[CARDS[k][0]] * x; n += x; G.owned[k] = 1; } }
  if (!n) return 0;
  G.coins += tot; G.sold += n; emit('sell', { n, coins: tot }); return tot;
}
// 중복 카드 수와 팔면 받는 코인
function dupInfo() {
  let n = 0, c = 0;
  for (const k in G.owned) { const x = G.owned[k] - 1; if (x > 0) { n += x; c += CONFIG.SELL_PRICE[CARDS[k][0]] * x; } }
  return { n, c };
}
// 팩을 산다(tier 0~2). 무료 동 팩이 있으면 먼저 쓴다. 성공하면 true
function buyPack(tier) {
  if (G.won) return false;
  const p = CONFIG.PACKS[tier]; const free = tier === 0 && G.free <= 0;
  if (!free && G.coins < p.cost) return false;
  finishReveal(true);
  if (free) G.free = CONFIG.FREE_PACK_SEC; else G.coins -= p.cost;
  G.packs++; G.lastTier = tier;
  G.reveal = { tier, free, cards: rollPack(tier).map(id => ({ id, flipped: false, isNew: false, n: 0 })) };
  emit('open', G.reveal);
  return true;
}
// 카드 한 장을 뒤집는다
function flipCard(i, auto) {
  const rv = G.reveal; if (!rv || !rv.cards[i] || rv.cards[i].flipped) return false;
  const c = rv.cards[i]; c.flipped = true;
  const r = applyCard(c.id); c.isNew = r.isNew; c.n = r.n;
  emit('flip', { i, c, auto: !!auto });
  return true;
}
// 아직 안 뒤집은 카드 중 맨 앞 하나를 뒤집는다
function flipNext() {
  const rv = G.reveal; if (!rv) return false;
  const i = rv.cards.findIndex(c => !c.flipped);
  return i >= 0 ? flipCard(i) : false;
}
// 남은 카드를 전부 뒤집는다(새 팩을 따면 자동으로 불림)
function finishReveal(auto) {
  const rv = G.reveal; if (!rv) return;
  rv.cards.forEach((c, i) => flipCard(i, auto));
}
// 아직 안 뒤집은 카드가 있나
function hasHidden() { return !!(G.reveal && G.reveal.cards.some(c => !c.flipped)); }
// 직원을 고용한다
function hire() {
  if (G.won || G.staff.length >= CONFIG.STAFF_MAX) return false;
  const c = staffCost(); if (G.coins < c) return false;
  G.coins -= c; G.staff.push({ timer: CONFIG.STAFF_SEC, last: [] });
  emit('hire', { n: G.staff.length }); return true;
}
// 시간을 dt초 흘린다(무료 팩 시간, 직원이 팩 까기)
function tick(dt) {
  if (G.won) return;
  G.t += dt;
  if (G.free > 0) G.free = Math.max(0, G.free - dt);
  for (let si = 0; si < G.staff.length; si++) {
    const s = G.staff[si]; s.timer -= dt;
    while (s.timer <= 0) {
      s.timer += CONFIG.STAFF_SEC; G.packs++;
      const ids = rollPack(0); const res = ids.map(applyCard); s.last = ids;
      emit('staff', { si, ids, res });
      if (G.won) break;
    }
    if (G.won) break;
  }
}

// ---- 소리(WebAudio) ----
let AC = null;
function audio() { if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } if (AC && AC.state === 'suspended') AC.resume(); return AC; }
// 짧은 소리 하나
function beep(f, d, type, vol, when, slide) {
  const a = AC; if (!a || DEMO) return;
  const t = a.currentTime + (when || 0), o = a.createOscillator(), g = a.createGain();
  o.type = type || 'square'; o.frequency.setValueAtTime(f, t); if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + d);
  g.gain.setValueAtTime(vol || .12, t); g.gain.exponentialRampToValueAtTime(.001, t + d);
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + d + .02);
}
const sfx = {
  buy() { beep(420, .08, 'square', .1, 0, 700); beep(700, .1, 'triangle', .1, .06); },
  flip(g) { beep(260 + g * 55, .12, 'triangle', .13, 0, 420 + g * 80); },
  coin() { beep(990, .07, 'square', .07); beep(1480, .12, 'square', .07, .06); },
  isnew() { [523, 659, 784].forEach((f, i) => beep(f, .12, 'triangle', .12, i * .07)); },
  rare(g) { const n = g - 2; for (let i = 0; i < 3 + n; i++) beep(440 * Math.pow(1.25, i), .18, 'square', .1, i * .08); },
  sss() { [523, 659, 784, 1047, 1319, 1568, 2093].forEach((f, i) => beep(f, .35, 'triangle', .16, i * .09)); beep(130, 1.2, 'sawtooth', .12, 0, 60); },

// ---- 가루/흔들림/번쩍 ----
const cv = $('#fx'), cx = cv.getContext('2d'); let parts = [];
function sizeFx() { cv.width = innerWidth; cv.height = innerHeight; }
addEventListener('resize', sizeFx); sizeFx();
// 가루 n개를 (x,y)에서 터뜨린다
function burst(x, y, color, n, sp) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * 6.283, v = (.3 + Math.random()) * sp;
    parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - sp * .3, life: .7 + Math.random() * .6, c: color === 'rain' ? 'hsl(' + Math.floor(Math.random() * 360) + ',100%,65%)' : color, s: 3 + Math.random() * 5 });
  }
}
// 가루 움직임 그리기
function fxStep(dt) {
  cx.clearRect(0, 0, cv.width, cv.height);
  parts = parts.filter(p => p.life > 0);
  for (const p of parts) {
    p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 600 * dt;
    cx.globalAlpha = Math.max(0, Math.min(1, p.life * 1.6)); cx.fillStyle = p.c; cx.fillRect(p.x - p.s / 2, p.y - p.s / 2, p.s, p.s);
  }
  cx.globalAlpha = 1;
}

// 하얗게 번쩍
function flash(op, ms) { const f = $('#flash'); f.style.transition = 'none'; f.style.opacity = op; void f.offsetWidth; f.style.transition = 'opacity ' + ms + 'ms'; f.style.opacity = 0; }
// 큰 글자 띄우기
function banner(text, color) { const b = $('#banner'); b.textContent = text; b.style.setProperty('--c', color); b.style.color = color; b.classList.remove('on'); void b.offsetWidth; b.classList.add('on'); }
// 떠오르는 글자

function artHtml(id, big) {

}
// 뒤집기 전 카드(뒷면) 만들기. R 이상은 미리 빛나서 두근두근
function makeCard(c, idx) {
  const g = CARDS[c.id][0];
  const d = document.createElement('div');
  d.className = 'card ' + gcls(g) + (g === 7 ? ' sssc' : '');
  d.style.animationDelay = (idx * 0.07) + 's';

    '<div class="fc"><span class="gr">' + GRADES[g] + '</span><span class="tag" style="display:none"></span>' + artHtml(c.id) + '<span class="nm">' + CARDS[c.id][2] + '</span></div></div>';

function doBuy(i) {

    sfx.flip(g);
    if (c.isNew) setTimeout(sfx.isnew, 120);
    if (g === 3) burst(x, y, gcolor(g), 16, 240);
    if (g === 4) { burst(x, y, gcolor(g), 30, 340); shake(4); setTimeout(() => sfx.rare(g), 150); }
    if (g === 5) { burst(x, y, gcolor(g), 50, 420); shake(8); flash(.25, 400); setTimeout(() => sfx.rare(g), 150); banner('S 등급!', gcolor(g)); }
    if (g === 6) { burst(x, y, gcolor(g), 90, 520); shake(14); flash(.5, 700); setTimeout(() => sfx.rare(g), 150); banner('SSR!!', gcolor(g)); }
    if (g === 7) { burst(x, y, 'rain', 160, 650); shake(22); flash(.9, 1200); setTimeout(sfx.sss, 150); banner('✨ SSS ✨', '#ffe17a'); }
  } else if (t === 'staff') {
    showStaffCards(d.si, d.ids); sfx.staff(); invDirty = dexDirty = true;
    const best = Math.max(...d.ids.map(id => CARDS[id][0]));
    const bi = d.ids.find(id => CARDS[id][0] === best), isNew = d.res[d.ids.indexOf(bi)].isNew;
    if (best >= 5) { toast('👷 직원이 ' + GRADES[best] + ' ' + CARDS[bi][1] + ' ' + CARDS[bi][2] + (isNew ? ' (NEW!)' : '') + ' 뽑음!', best); sfx.rare(best); if (best >= 6) flash(.25, 500); }
    else if (d.res.some(r => r.isNew)) { const k = d.res.findIndex(r => r.isNew); toast('👷 새 카드! ' + CARDS[d.ids[k]][1] + ' ' + CARDS[d.ids[k]][2], CARDS[d.ids[k]][0]); }
  } else if (t === 'hire') {
    fillSlot(d.n - 1); sfx.hire(); const r = slotEls[d.n - 1].getBoundingClientRect(); burst(r.left + r.width / 2, r.top + r.height / 2, '#57e0a0', 24, 260);
  } else if (t === 'sell') {
    invDirty = true; sfx.coin();
    const co = $('#coins'); co.classList.remove('bump'); void co.offsetWidth; co.classList.add('bump');
    const r = co.getBoundingClientRect(); floatText(r.left + 20, r.bottom, '+' + d.coins + '🪙');
  } else if (t === 'won') {
    setTimeout(showResult, 1600);
  }
};

// ---- 화면 갱신 ----
const fmtT = s => Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0');
// 안내 한 줄(상황에 따라 바뀜)
function hintText() {
  if (G.packs === 0) return '팩을 눌러 뜯어봐! (1번 키)';
  if (hasHidden()) return '카드를 눌러 뒤집어! (스페이스)';
  if (G.staff.length === 0 && G.coins >= staffCost()) return '코인으로 직원을 고용하면 알아서 팩을 까줘! (H)';
  const di = dupInfo();
  if (G.sold === 0 && di.n > 0) return '뽑은 카드는 🎒 내 카드에 쌓여! 중복을 팔면 +' + di.c + '🪙';
  if (G.dups === 0) return '또 나온 카드는 🎒 내 카드에 쌓여. 팔아서 코인을 벌자!';
  if (G.staff.length === 0 && G.coins + di.c >= staffCost()) return '🎒 내 카드에서 중복을 팔고 직원을 고용하자! (H)';
  if (G.staff.length === 0) return '직원 ' + staffCost() + '🪙 모으자! 또는 팩을 더 까자.';
  if (G.coins >= CONFIG.PACKS[2].cost) return '금 팩이면 높은 등급이 잘 나와! (3번 키)';
  return '남은 카드 ' + (CARDS.length - G.count) + '장. 팩을 까거나 직원을 늘려봐!';
}
// 매 프레임 숫자/버튼 상태 갱신
function updateUI() {
  if (!G) return;
  $('#coins').textContent = '🪙 ' + Math.floor(G.coins);
  $('#dexn').textContent = '📖 ' + G.count + '/' + CARDS.length;
  $('#dexfill').style.width = (G.count / CARDS.length * 100) + '%';
  $('#time').textContent = '⏱ ' + fmtT(G.won ? G.winT : G.t);
  CONFIG.PACKS.forEach((p, i) => {
    const e = pkEls[i], free = i === 0 && G.free <= 0;
    e.querySelector('.cost').textContent = free ? '🎁 무료!' : (i === 0 && G.free > 0 ? p.cost + '🪙 (무료 ' + Math.ceil(G.free) + '초)' : p.cost + '🪙');
    e.classList.toggle('off', !free && G.coins < p.cost); e.classList.toggle('free', free);
  });
  const full = G.staff.length >= CONFIG.STAFF_MAX, hb = $('#hire');
  hb.textContent = full ? '직원 가득!' : '👷 직원 고용 ' + staffCost() + '🪙 (H)';
  hb.classList.toggle('off', full || G.coins < staffCost());
  $('#staffh').textContent = '👷 직원 ' + G.staff.length + '/' + CONFIG.STAFF_MAX + ' · 각자 ' + CONFIG.STAFF_SEC + '초마다 동 팩';
  G.staff.forEach((s, i) => { const b = slotEls[i] && slotEls[i].querySelector('.pb i'); if (b) b.style.width = (100 - s.timer / CONFIG.STAFF_SEC * 100) + '%'; });
  $('#hint').textContent = hintText();
  const hid = hasHidden(); $('#flipall').style.display = hid ? 'inline-block' : 'none';
  const ip = $('#idlepack'); if (!G.reveal) { ip.style.display = ''; } ip.className = 't' + G.lastTier;
  const di = dupInfo();
  $('#invbadge').textContent = di.n ? '+' + di.c + '🪙' : '';
  if (tab === 'inv' && invDirty) renderInv(di);
  if (tab === 'dex' && dexDirty) renderDex();
}
// 탭 바꾸기: cart / inv / dex
function setTab(t) {
  if (t !== 'cart' && screen !== 'play') t = 'cart';
  tab = t;
  ['cart', 'inv', 'dex'].forEach(k => $('#p' + k).classList.toggle('on', k === t));
  document.querySelectorAll('#tabbar button').forEach(b => b.classList.toggle('on', b.dataset.tab === t));
  invDirty = dexDirty = true; if (G) updateUI();
}
// 내 카드 화면 그리기(바뀐 칸만 고쳐서 누르는 중인 버튼이 사라지지 않게)
const invCells = {};
function invArt(id) { const k = CARD_IMG[id]; return k && IMG[k] ? '<img src="' + IMG[k] + '" alt="">' : CARDS[id][1]; }
function renderInv(di) {
  invDirty = false; di = di || dupInfo();
  let total = 0, val = 0; const have = [];
  CARDS.forEach((c, id) => { const n = G.owned[id] || 0; if (!n) return; total += n; val += n * CONFIG.SELL_PRICE[c[0]]; have.push(id); });
  $('#invsum').textContent = '· ' + total + '장 · 전부 팔면 ' + val + '🪙';
  const sd = $('#selldups'); sd.textContent = di.n ? '중복 ' + di.n + '장 모두 팔기 +' + di.c + '🪙' : '중복 카드 없음'; sd.classList.toggle('off', !di.n);
  const grades = [...new Set(have.map(id => CARDS[id][0]))].sort((a, b) => b - a);
  if (invFilter >= 0 && !grades.includes(invFilter)) invFilter = -1;
  const fkey = grades.join(',') + '|' + invFilter, fb = $('#invfilter');
  if (fb.dataset.k !== fkey) {
    fb.dataset.k = fkey;
    fb.innerHTML = '<button data-g="-1" class="' + (invFilter < 0 ? 'on' : '') + '">전체</button>' +
      grades.map(g => '<button data-g="' + g + '" class="' + gcls(g) + (invFilter === g ? ' on' : '') + '">' + GRADES[g] + '</button>').join('');
  }
  const show = have.filter(id => invFilter < 0 || CARDS[id][0] === invFilter).sort((a, b) => CARDS[b][0] - CARDS[a][0] || a - b);
  const grid = $('#invgrid');
  for (const k in invCells) if (!show.includes(+k)) { invCells[k].remove(); delete invCells[k]; }
  show.forEach(id => {
    let e = invCells[id];
    if (!e) {
      const g = CARDS[id][0], p = CONFIG.SELL_PRICE[g];
      e = invCells[id] = document.createElement('div'); e.className = 'ic ' + gcls(g) + (g === 7 ? ' sssc' : '');
      e.innerHTML = '<span class="gr">' + GRADES[g] + '</span><span class="n"></span><div class="art">' + invArt(id) + '</div><div class="nm">' + CARDS[id][2] + '</div>' +
        '<button class="s1" data-act="one" data-id="' + id + '">1장 팔기 +' + p + '🪙</button><button data-act="dup" data-id="' + id + '"></button>';
    }
    const n = G.owned[id], p = CONFIG.SELL_PRICE[CARDS[id][0]];
    e.querySelector('.n').textContent = '×' + n;
    const b = e.querySelector('[data-act=dup]'); b.hidden = n < 2; b.textContent = '1장 남기고 팔기 +' + (n - 1) * p + '🪙';
  });
  const key = show.join(',');
  if (key !== invOrder) { invOrder = key; show.forEach(id => grid.appendChild(invCells[id])); }
  $('#invempty').style.display = have.length ? 'none' : '';
}
// 도감 창 그리기
function renderDex() {
  dexDirty = false; const g = $('#dexgrid'); g.innerHTML = '';
  for (let gi = 7; gi >= 0; gi--) {
    const row = document.createElement('div'); row.className = 'dexrow ' + gcls(gi);
    let have = 0, tot = 0, cells = '';
    CARDS.forEach((c, id) => { if (c[0] !== gi) return; tot++; const n = G.owned[id] || 0; if (G.seen[id]) have++;
      cells += G.seen[id] ? '<div class="dc ' + gcls(gi) + '" title="' + c[2] + '">' + (CARD_IMG[id] ? '<img src="' + IMG[CARD_IMG[id]] + '" alt="">' : c[1]) + (n ? '<small>×' + n + '</small>' : '') + '</div>' : '<div class="dc no ' + gcls(gi) + '">?</div>'; });
    row.innerHTML = '<span class="gl">' + GRADES[gi] + '</span>' + cells; g.appendChild(row);
  }
  $('#dextitle').textContent = '📖 도감 ' + G.count + '/' + CARDS.length;
}
// 결과 화면
function showResult() {
  screen = 'result'; setTab('cart');
  const t = G.winT; let newBest = false;
  if (!best || t < best) { best = t; newBest = true; try { localStorage.setItem(BESTKEY, String(Math.floor(t))); } catch (e) {} }
  $('#resinfo').innerHTML = '완성 시간 <b>' + fmtT(t) + '</b> · 깐 팩 ' + G.packs + '개 · 직원 ' + G.staff.length + '명<br>최고 기록 <b>' + fmtT(best) + '</b>' + (newBest ? ' 🏆 새 기록!' : '');
  $('#result').classList.add('on'); flash(.6, 900); burst(innerWidth / 2, innerHeight / 3, 'rain', 200, 600);
  if (!DEMO) sfx.sss();
}
// 시작/다시 하기
function startGame() {
  audio(); newGame(); buildSlots(); seenDup = false; firstFlip = false;
  $('#cards').innerHTML = ''; $('#idlepack').style.display = ''; $('#title').classList.remove('on'); $('#result').classList.remove('on');
  for (const k in invCells) { invCells[k].remove(); delete invCells[k]; } invOrder = ''; invFilter = -1;
  screen = 'play'; setTab('cart');
}

// ---- 입력(키보드 + 터치) ----
$('#startbtn').addEventListener('click', startGame);
$('#againbtn').addEventListener('click', startGame);
$('#tabbar').addEventListener('click', e => { const b = e.target.closest('button'); if (b) { audio(); setTab(b.dataset.tab); } });
$('#selldups').addEventListener('click', () => { audio(); if (!sellDups()) sfx.nope(); });
$('#invfilter').addEventListener('click', e => { const b = e.target.closest('button'); if (b) { invFilter = +b.dataset.g; invDirty = true; updateUI(); } });
$('#invgrid').addEventListener('click', e => {
  const b = e.target.closest('button[data-act]'); if (!b) return; audio();
  const id = +b.dataset.id, n = G.owned[id] || 0;
  if (!sellCard(id, b.dataset.act === 'dup' ? n - 1 : 1)) sfx.nope();
});
$('#hire').addEventListener('click', () => { audio(); doHire(); });
$('#flipall').addEventListener('click', () => { audio(); if (G.reveal) flipAllSlow(); });
$('#idlepack').addEventListener('click', () => { audio(); doBuy(G.lastTier); });
$('#idlepack').src = IMG.pack;
$('#stage').style.backgroundImage = 'url(' + IMG.bg + ')';
// 직원 고용(소리와 흔들기 포함)
function doHire() { if (screen !== 'play') return; if (!hire()) { sfx.nope(); } }
// 남은 카드를 차례대로 뒤집는다(좋은 카드가 마지막에 와서 두근두근)
function flipAllSlow() {
  if (!G.reveal) return; const rv = G.reveal; let k = 0;
  rv.cards.forEach((c, i) => { if (!c.flipped) { setTimeout(() => { if (G.reveal === rv) flipCard(i); }, (k++) * 260); } });
}
addEventListener('keydown', e => {
  if (e.repeat) return; audio();
  const k = e.key;
  if (screen === 'title') { if (k === 'Enter' || k === ' ') { e.preventDefault(); startGame(); } return; }
  if (screen === 'result') { if (k === 'Enter' || k === ' ') { e.preventDefault(); startGame(); } return; }
  if (k === 'd' || k === 'D') { setTab(tab === 'dex' ? 'cart' : 'dex'); return; }
  if (k === 'i' || k === 'I') { setTab(tab === 'inv' ? 'cart' : 'inv'); return; }
  if (k === 'Escape') { setTab('cart'); return; }
  if (tab !== 'cart') return;
  if (k === '1' || k === '2' || k === '3') doBuy(+k - 1);
  else if (k === 'h' || k === 'H') doHire();
  else if (k === ' ' || k === 'Enter') { e.preventDefault(); if (hasHidden()) flipNext(); else doBuy(G.lastTier); }
  else if (k === 'a' || k === 'A') { if (hasHidden()) flipAllSlow(); }
});

// ---- 자동 시연(DEMO): 사람 없이 스스로 플레이 ----
let demoT = 0, demoResT = 0;
// 시연 봇이 0.5초마다 한 가지를 한다
function demoStep(dt) {
  if (!DEMO) return;
  demoT -= dt; if (demoT > 0) return; demoT = 0.55;
  if (screen === 'title') { startGame(); return; }
  if (screen === 'result') { demoResT += 0.55; if (demoResT > 6) { demoResT = 0; startGame(); } return; }
  if (hasHidden()) { flipNext(); return; }
  if (dupInfo().c >= 15) { sellDups(); return; }
  if (G.staff.length < 4 && G.coins >= staffCost()) { doHire(); return; }
  if (G.coins >= CONFIG.PACKS[2].cost + 40) { doBuy(2); return; }
  if (G.coins >= CONFIG.PACKS[1].cost + 20 && G.staff.length >= 3) { doBuy(1); return; }
  const saving = G.staff.length < 4 && G.coins < staffCost() + 20; // 직원 값을 모으는 중이면 무료 팩만
  if (G.free <= 0 || (!saving && G.coins >= CONFIG.PACKS[0].cost)) doBuy(0);
}

// ---- 메인 루프 ----
let lastT = performance.now();
function frame() {
  const now = performance.now(), dt = Math.min(.1, (now - lastT) / 1000); lastT = now;
  try { if (screen === 'play') { tick(dt * (window.__FF || 1)); updateUI(); } fxStep(dt); demoStep(dt); }
  catch (e) { window.__err = String(e && e.stack || e); console.error(e); }
}
buildBuy(); newGame(); buildSlots(); updateUI();
window.__game = { get G() { return G; }, CONFIG, CARDS, tick, buyPack, hire, sellCard, sellDups, dupInfo, setTab, flipCard, flipNext, newGame, staffCost, startGame, get screen() { return screen; } };
setInterval(frame, 33); // 화면 갱신 루프(33ms)
window.addEventListener('error', e => { window.__err = (window.__err || '') + e.message + ' '; });
</script>
</body>
</html>
